services:
  # 1. WhatsGestores - Aplicação Web Next.js + IA Gemini
  whatsgestores-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsgestores-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-whatsgestores_secret_key}
    volumes:
      - ./prisma:/app/prisma
      - ./uploads:/app/public/uploads
    depends_on:
      - evolution-api
    networks:
      - whatsgestores-net

  # 2. Robô WhatsApp - Evolution API v2 (Conexão 24/7 com grupos)
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_PUBLIC_URL:-http://179.199.143.195:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-whatsgestores_secret_key}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass@postgres:5432/evolution_db?schema=public
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://whatsgestores-app:3000/api/whatsapp/webhook
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_GLOBAL_BASE64=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      - postgres
      - redis
    networks:
      - whatsgestores-net

  # 3. Banco de Dados PostgreSQL dedicado para o Robô Evolution API
  postgres:
    image: postgres:15-alpine
    container_name: whatsgestores-postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_pass
      - POSTGRES_DB=evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whatsgestores-net

  # 4. Cache Redis para controle de sessões e filas
  redis:
    image: redis:7-alpine
    container_name: whatsgestores-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - whatsgestores-net

volumes:
  evolution_instances:
  evolution_store:
  postgres_data:
  redis_data:

networks:
  whatsgestores-net:
    driver: bridge